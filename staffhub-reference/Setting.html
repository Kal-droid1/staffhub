<style>
        .glass-panel {
            background: rgba(252, 249, 242, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 32px rgba(31, 107, 77, 0.08);
        }
        
        .mesh-bg {
            background-color: #FAF7F0;
            background-image: 
                radial-gradient(at 0% 0%, rgba(31, 107, 77, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 164, 65, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(140, 214, 177, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .input-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(31, 107, 77, 0.2);
            border-color: #1f6b4d;
        }
      </style>
</head>
<body class="mesh-bg text-on-surface min-h-screen font-body-lg text-body-lg flex flex-col">
<!-- TopNavBar -->
<nav class="flex justify-between items-center w-full px-container-padding h-16 fixed top-0 z-50 bg-primary dark:bg-primary-container shadow-md">
<div class="flex items-center gap-8">
<span class="font-headline-lg text-headline-lg font-extrabold text-on-primary">StaffHub</span>
<div class="hidden md:flex gap-6 h-full items-center">
<a class="text-on-primary/80 font-medium hover:text-on-primary h-full flex items-center px-2 hover:bg-primary-container/20 transition-colors" href="#">Attendance</a>
<!-- TODO: "Participants" nav link removed in real app — global search bar replaces it. Mockup artifact. -->
<a class="text-on-primary/80 font-medium hover:text-on-primary h-full flex items-center px-2 hover:bg-primary-container/20 transition-colors" href="#">Participants</a>
<!-- TODO: "Leave Types" nav link removed in real app — now lives in Settings gear icon. -->
<a class="text-on-primary/80 font-medium hover:text-on-primary h-full flex items-center px-2 hover:bg-primary-container/20 transition-colors" href="#">Leave Types</a>
<a class="text-on-primary font-bold border-b-2 border-secondary-container pb-1 h-full flex items-center px-2 hover:bg-primary-container/20 transition-colors opacity-90 transition-opacity" href="#">Staff</a>
<a class="text-on-primary/80 font-medium hover:text-on-primary h-full flex items-center px-2 hover:bg-primary-container/20 transition-colors" href="#">Balances</a>
</div>
</div>
<div class="flex items-center gap-4">
<!-- TODO: "Change Password" text link replaced by gear icon in real app, which links to /settings. Mockup artifact. -->
<button class="text-on-primary/80 hover:text-on-primary font-medium hover:bg-primary-container/20 transition-colors px-3 py-2 rounded-lg">Change Password</button>
<button class="text-on-primary font-bold hover:bg-primary-container/20 transition-colors px-3 py-2 rounded-lg border border-on-primary/30">Log out</button>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow pt-24 pb-12 px-margin-sm md:px-margin-md lg:px-container-padding max-w-7xl mx-auto w-full">
<!-- Header -->
<header class="mb-10">
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2">Settings</h1>
<p class="text-on-surface-variant">Manage your account, leave types, and job titles.</p>
</header>
<div class="flex flex-col lg:flex-row gap-gutter">
<!-- Side Navigation (Settings Categories) -->
<aside class="w-full lg:w-64 flex-shrink-0 mb-8 lg:mb-0">
<nav class="flex lg:flex-col gap-2 overflow-x-auto pb-4 lg:pb-0 scrollbar-hide border-b lg:border-b-0 lg:border-l border-outline-variant/30 lg:pl-4">
<a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-surface-container-highest text-on-surface font-label-caps text-label-caps relative whitespace-nowrap lg:whitespace-normal" href="#">
<span class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-l-lg lg:rounded-none lg:-left-[17px] lg:w-[2px] lg:h-full lg:rounded-full"></span>
<span class="material-symbols-outlined text-[18px]">lock</span>
                        CHANGE PASSWORD
                    </a>
<!-- TODO: "Profile Picture" tab removed in real app — moved to nav avatar popup. Mockup artifact. -->
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest/50 font-label-caps text-label-caps transition-colors whitespace-nowrap lg:whitespace-normal" href="#">
<span class="material-symbols-outlined text-[18px]">event_note</span>
                        LEAVE TYPES
                    </a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest/50 font-label-caps text-label-caps transition-colors whitespace-nowrap lg:whitespace-normal" href="#">
<span class="material-symbols-outlined text-[18px]">work_outline</span>
                        JOB TITLES
                    </a>
</nav>
</aside>
<!-- Settings Canvas -->
<div class="flex-grow">
<div class="glass-panel rounded-xl p-6 md:p-8 relative overflow-hidden">
<!-- Amber Accent Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-secondary-container"></div>
<h2 class="font-title-md text-title-md text-on-surface mb-6">
                        Update Password
                    </h2>
<form class="max-w-md space-y-6">
<!-- Current Password -->
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-tertiary" for="current_password">Current Password</label>
<div class="relative">
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none input-glow transition-all" id="current_password" placeholder="Enter current password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- New Password -->
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-tertiary" for="new_password">New Password</label>
<div class="relative">
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none input-glow transition-all" id="new_password" placeholder="Enter new password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant/80 mt-1">Must be at least 6 characters long.</p>
</div>
<!-- Confirm New Password -->
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-tertiary" for="confirm_password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none input-glow transition-all" id="confirm_password" placeholder="Confirm new password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Action -->
<div class="pt-4 border-t border-outline-variant/30">
<button class="bg-primary text-on-primary font-title-md text-title-md px-6 py-3 rounded-lg shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all w-full md:w-auto" type="button">
                                Change Password
                            </button>
</div>
</form>
